[workspace]
members = ["cargo:."]

# Release builds with dist (https://opensource.axo.dev/cargo-dist/).
# Releases are cut only by running the Release workflow by hand
# (workflow_dispatch); pushing a tag does nothing. No public release has
# been cut: the licensing of the bundled RefEngine code and of the NWL23
# data files is still an open question for the owner.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = []
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
dispatch-releases = true
pr-run-mode = "skip"
