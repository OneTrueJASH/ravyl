[workspace]
members = ["cargo:."]
# Release only the ravyl app. crates/ravyn also has a binary (the ravyn CLI),
# but it belongs to RAVYN's own repository, and dist refuses a workspace
# whose released packages name different repositories. (dist 0.32 reads
# `packages` here, not under [dist].)
packages = ["ravyl"]

# Release builds with dist (https://opensource.axo.dev/cargo-dist/).
# Releases are cut only by running the Release workflow by hand
# (workflow_dispatch); pushing a tag does nothing. No public release has
# been cut. The archives carry no data files.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = []
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
dispatch-releases = true
pr-run-mode = "skip"
# release.yml has its actions pinned to commit SHAs by hand (supply-chain
# safety), so it differs from what dist generates.
allow-dirty = ["ci"]

# dist 0.32 would build Apple Silicon on macos-14, which GitHub retired
# on 2026-11-02; both macOS builds use macOS 26, like CI.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26-intel"
