# cargo-deny: licenses and security advisories of the dependency tree.
# Run with `cargo deny check`. CI runs it on every push and pull request.
#
# This covers Rust crates only. The data files (the word list and the
# trained leave table) are not crates and are not checked here.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported as warnings, vulnerabilities fail.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# cpsolver2 and RAVYN are MIT and unpublished; only dependencies are
# checked against the allow list.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
