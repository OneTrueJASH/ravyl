[package]
name = "ravyl"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for analyzing Crossplay and Scrabble positions, built on the RAVYN engine"
license = "MIT"
repository = "https://github.com/OneTrueJASH/ravyl"
keywords = ["crossplay", "word-game", "solver", "tui", "scrabble"]
categories = ["command-line-utilities", "games"]
rust-version = "1.88"
# The banner is shown from GitHub; CI and scripts are not part of the package.
exclude = ["/assets", "/.github", "/scripts"]

[workspace]
members = ["crates/ravyn"]
# Plain `cargo build/test/clippy` at the root cover the engine too.
default-members = [".", "crates/ravyn"]

[dependencies]
ravyn = { path = "crates/ravyn", version = "0.1.0" }
log = "0.4"
ratatui = "0.30"
fst = "0.4"
anyhow = "1.0"
rayon = "1.10"
fastrand = "2.3.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6.0"

[target.'cfg(unix)'.dependencies]
# Closing the terminal (SIGHUP) or a kill (SIGTERM, SIGINT) saves the game
# before exiting.
signal-hook = "0.3"

[dev-dependencies]
insta = "1"


[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[package.metadata.dist]
# publish = false hides the binary from dist by default.
dist = true
