[package]
name = "cpsolver2"
version = "0.1.0"
edition = "2021"
description = "TUI solver for NYT Crossplay word game positions"
license = "MIT"
repository = "https://github.com/OneTrueJASH/cpsolver2"
keywords = ["crossplay", "word-game", "solver", "tui", "scrabble"]
categories = ["command-line-utilities", "games"]
rust-version = "1.82"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
fst = "0.4"
anyhow = "1.0"
rayon = "1.10"
fastrand = "2.3.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6.0"
